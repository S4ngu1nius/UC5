<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Style InLine</title>
    <style>
        .titulo {
            color: red;
            font-size: 30px;
            font-weight: bold;
        }
        .texto {
            color: grey;
            font-size: 20px;
        }
    </style>
</head>
<body>
    
    <p class="titulo">Titulo do meu documento</p>
    
    <p class="texto">Lorem ipsum, dolor sit amet consectetur adipisicing elit. 
        Sequi nesciunt debitis sit dolor quo facilis doloremque iusto omnis repellat aliquam obcaecati commodi sed nulla rem consectetur suscipit, 
        corrupti veritatis perferendis?</p>
</body>
</html>
