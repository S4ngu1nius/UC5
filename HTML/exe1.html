<!--

monte uma tabela simples:
lista de compras da semana

titulo da tabela: Itens para o escritório
Item | Quantidade | Preço Unitário | Total
3 produtos 

Mostre o preço total da compra no final da tabela.

-->

<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Compras</title>
</head>
<body>
    
    <h1>Itens para o escritório</h1>
    <table border="1">
        <thead>
            <tr>
                <th>Item</th>
                <th>Quantidade</th>
                <th>Preço Unitário</th>
                <th>Total</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Caderno</td>
                <td>2</td>
                <td>R$ 10,00</td>
                <td>R$ 20,00</td>
            </tr>
            <tr>
                <td>Caneta</td>
                <td>5</td>
                <td>R$ 2,00</td>
                <td>R$ 10,00</td>
            </tr>
            <tr>
                <td>Lápis</td>
                <td>3</td>
                <td>R$ 1,50</td>
                <td>R$ 4,50</td>
            </tr>
        </tbody>
        <tfoot>
            <tr>
                <th colspan="3">Preço Total da Compra</th>
                <th>R$ 34,50</th>
            </tr>
        </tfoot>
    </table>

</body>
</html>
