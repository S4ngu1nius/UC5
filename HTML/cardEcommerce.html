<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-commerce Card</title>
    <link rel="stylesheet" href="./cardEcommerce.css">
</head>
<body>
    
    <div class="product-card">

        <span class="badge-discount">20% OFF</span>
        <img src="./img/tenis-on-running-removebg-preview.png" alt="Tênis Esportivo" class="product-img">

        <div class= "product-info">
            <span class="category">Calçados</span>
            <h3 class="product-title">Tênis Running Pro</h3>
            <div class="price-box">
                <span class="old-price">R$ 100,00</span>
                <span class="current-price">R$ 80,00</span>
            </div>
            <button class="buy-button">Comprar</button>
    </div>

</body>
</html>
